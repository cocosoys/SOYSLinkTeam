# ============================================================================
#  SOYSLinkTeam - 主配置文件
# ----------------------------------------------------------------------------
#  一个高度自定义的队伍插件，完全替代 Minecraft 原生队伍(Scoreboard Team)功能。
#  强制依赖: PlaceholderAPI
#
#  修改本文件后使用 /teamadmin reload 重载。
#  注意: storage.backends 下的后端启停属于结构性变更，重载后会重建存储连接，
#        建议在无人在线时操作。
#
#  ⚠ 配置拆分说明
#  队伍规则(team) / 入队方式(join) / 权限体系(permission) 已拆分到 teams.yml，
#  请到 plugins/SOYSLinkTeam/teams.yml 中修改这三类配置。
#  本文件仅保留: 通用设置 / 数据存储 / PAPI / 指令。
# ============================================================================

# 配置文件版本，用于自动升级检测，请勿手动修改
config-version: 1


# ============================================================================
#  通用设置
# ============================================================================
general:
  # 消息语言
  #   zh_CN - 简体中文（默认，对应 messages.yml）
  #   en    - English（对应 messages_en.yml）
  # 修改后执行 /teamadmin reload 生效，插件会自动释放对应语言文件到配置目录
  language: zh_CN

  # 调试模式。开启后会在控制台输出存储读写、队伍装载/卸载等详细日志
  debug: false


# ============================================================================
#  数据存储
# ----------------------------------------------------------------------------
#  【内存模型】
#  插件启动时不会把所有队伍读进内存，只常驻一份轻量的「玩家 -> 队伍」索引。
#  队伍在被访问时按需装载进内存(激活)，超过 active-timeout 无任何活动则
#  写回存储并从内存卸载，以此控制大服的内存占用。
#
#  【多后端】
#  三种后端可同时开启。优先级固定为: MYSQL > SQLITE > YAML
#  已启用的后端中优先级最高者为「主存储」，负责所有读操作；
#  其余启用的后端作为「辅助存储」，写入时被镜像同步，充当热备份。
#  例: 同时开启 mysql 与 yaml -> MySQL 为主库，yaml 自动保持一份可读的本地副本。
#
#  【互转与覆盖】
#  使用 /teamadmin migrate <来源> <目标> 在任意两个后端之间转换数据，
#  使用 /teamadmin sync 将主存储的全量数据覆盖写入所有辅助存储。
# ============================================================================
storage:

  # --------------------------------------------------------------
  #  内存激活策略
  # --------------------------------------------------------------
  memory:
    # 队伍在内存中的活跃存活时间（分钟）
    # 队伍在此时间内没有任何成员活动，将被写回存储并从内存卸载
    active-timeout: 30

    # 活跃检测任务的运行间隔（秒）
    check-interval: 60

    # 定时自动保存间隔（秒），0 = 关闭（仅在卸载与关服时保存）
    auto-save-interval: 300

    # 是否在成员上线时立刻装载其队伍
    # true  = 上线即装载，队伍相关变量(PAPI)立即可用，推荐
    # false = 仅在玩家真正使用队伍功能时才装载，更省内存
    load-on-join: true

    # 队伍内还有成员在线时，是否禁止卸载
    # true  = 只要有人在线队伍就常驻内存（推荐，避免频繁装卸）
    # false = 严格按 active-timeout 计时，无活动即卸载
    keep-loaded-while-online: true

  # --------------------------------------------------------------
  #  存储后端
  # --------------------------------------------------------------
  backends:

    # ---------- YAML（默认启用，零依赖） ----------
    yaml:
      enabled: true
      # 数据文件路径，相对于 plugins/SOYSLinkTeam/
      file: data/teams.yml
      # 是否在每次写入前生成 .bak 备份
      backup-on-save: false

    # ---------- SQLite（默认禁用） ----------
    sqlite:
      enabled: false
      # 数据库文件路径，相对于 plugins/SOYSLinkTeam/
      file: data/teams.db
      table-prefix: 'mc_slt_'

    # ---------- MySQL（默认禁用，启用后自动成为主存储） ----------
    # 仅需下方精简字段，URL 直接用于建立并测试连接
    mysql:
      enabled: false
      # 完整 JDBC 连接串，驱动会通过 url 自动识别连接参数
      url: 'jdbc:mysql://localhost:3306/minecraft?useUnicode=true&characterEncoding=utf8&autoReconnect=true&useSSL=false&serverTimezone=Asia/Shanghai'
      username: root
      password: ''
      table-prefix: 'mc_slt_'
      # 连接保活探测间隔（秒），防止长时间空闲被服务端断开。0 = 关闭
      keepalive-interval: 1800

  # --------------------------------------------------------------
  #  辅助存储镜像写入
  # --------------------------------------------------------------
  mirror:
    # 是否把写操作镜像到所有辅助存储
    enabled: true
    # 镜像写入是否异步执行（推荐 true，避免阻塞主线程）
    async: true
    # 插件启动时，是否用主存储的数据全量覆盖辅助存储
    # 适用于从 YAML 迁移到 MySQL 后保持本地副本一致
    sync-on-startup: false


# ============================================================================
#  ⚠ 以下三类配置已迁移至 teams.yml
# ----------------------------------------------------------------------------
#  team       - 队伍规则（人数 / 名称 / 简称 / 公告 / 行为）
#  join       - 入队方式（邀请 / 公开 / 口令）
#  permission - 权限体系（判定链 / 角色动作 / 副队长上限）
#  请编辑 plugins/SOYSLinkTeam/teams.yml 进行修改，重载命令不变：/teamadmin reload
# ============================================================================


# ============================================================================
#  PlaceholderAPI 变量
# ----------------------------------------------------------------------------
#  可用变量:
#    %soyslinkteam_has_team%       是否有队伍 (true/false 文本见下方)
#    %soyslinkteam_name%           队伍名称
#    %soyslinkteam_tag%            队伍简称
#    %soyslinkteam_id%             队伍唯一 ID
#    %soyslinkteam_leader%         队长名称
#    %soyslinkteam_role%           自己在队伍中的角色（显示名）
#    %soyslinkteam_size%           队伍当前人数
#    %soyslinkteam_max_size%       队伍人数上限
#    %soyslinkteam_online%         队伍在线人数
#    %soyslinkteam_offline%        队伍离线人数
#    %soyslinkteam_notice%         队伍公告
#    %soyslinkteam_public%         是否公开
#    %soyslinkteam_locked%         是否设有口令
#    %soyslinkteam_created%        队伍创建时间
#    %soyslinkteam_members%        队伍成员列表（逗号分隔）
#    %soyslinkteam_members_online% 在线成员列表（逗号分隔）
#    %soyslinkteam_is_leader%      自己是否为队长
#    %soyslinkteam_total_teams%    服务器队伍总数
# ============================================================================
placeholder:
  # 玩家没有队伍时，各变量返回的默认值
  no-team: '&7无队伍'
  # 布尔值显示文本
  boolean:
    true-text: '&a是'
    false-text: '&c否'
  # 成员列表分隔符
  list-separator: '&7, '
  # 成员列表最多显示几个（超出显示 ...），0 = 不限制
  list-limit: 10
  # 时间格式
  date-format: 'yyyy-MM-dd HH:mm'
  # 角色显示名
  role-display:
    LEADER: '&6队长'
    ADMIN: '&e副队长'
    MEMBER: '&f队员'


# ============================================================================
#  指令设置
# ============================================================================
command:
  # 每页显示的队伍数量（/team list）
  list-page-size: 8
  # 是否启用 Tab 补全
  tab-complete: true
  # Tab 补全是否列出在线玩家名（关闭可保护玩家隐私）
  tab-complete-players: true
