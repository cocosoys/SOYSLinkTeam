# ============================================================================
#  SOYSLinkTeam - 队伍规则 / 入队方式 / 权限体系 配置文件
# ----------------------------------------------------------------------------
#  本文件从 config.yml 拆分而出，集中管理三类「结构性」配置：
#    1. team      - 队伍规则（人数、名称、简称、公告、行为）
#    2. join      - 入队方式（邀请 / 公开 / 口令，及其策略顺序）
#    3. permission- 权限体系（判定链、角色动作映射、副队长上限）
#
#  通用设置 / 数据存储 / PAPI / 指令 等仍留在 config.yml。
#  修改本文件后使用 /teamadmin reload 重载。
# ============================================================================


# ============================================================================
#  队伍规则
# ============================================================================
team:

  # --------------------------------------------------------------
  #  人数上限
  #  最终上限 = max(default-max-size, 玩家拥有的 soyslinkteam.size.<n> 最大值)
  #  且不超过 hard-max-size
  # --------------------------------------------------------------
  size:
    # 默认最大成员数
    default-max: 5
    # 硬上限，任何权限节点都无法突破
    hard-max: 30
    # 以队长的权限计算队伍上限（false = 以队伍创建时的快照为准）
    follow-leader-permission: true

  # --------------------------------------------------------------
  #  队伍名称
  # --------------------------------------------------------------
  name:
    min-length: 2
    max-length: 16
    # 名称合法性正则，默认允许 中文/英文/数字/下划线
    pattern: '^[\u4e00-\u9fa5A-Za-z0-9_]+$'
    # 是否允许重名
    allow-duplicate: false
    # 是否区分大小写判重
    case-sensitive: false
    # 禁用词（包含即拒绝，不区分大小写）
    blacklist:
      - admin
      - 管理员
      - 服务器
      - console

  # --------------------------------------------------------------
  #  队伍简称 / 前缀（供 PAPI 变量与聊天插件使用）
  # --------------------------------------------------------------
  tag:
    # 是否启用队伍简称
    enabled: true
    min-length: 1
    max-length: 6
    pattern: '^[\u4e00-\u9fa5A-Za-z0-9]+$'
    # 未设置简称时，PAPI 变量 %soyslinkteam_tag% 的回退值
    # 可用占位: {name}
    fallback: '{name}'

    # ============================================================
    #  聊天前缀 / 头顶名称 接入说明（零代码，靠服主配格式）
    # ------------------------------------------------------------
    #  1) 聊天前缀：本插件已注册 PAPI 变量 %soyslinkteam_tag%，
    #     服务器管理员只需把它放进聊天格式串即可，无需任何 EssentialsX / CMI 代码：
    #       - EssentialsX:  config.yml 的 chat: format 中写 %soyslinkteam_tag%
    #       - CMI:          聊天格式节点中写 %soyslinkteam_tag%
    #       - LuckPerms:    前缀/后缀节点中写 %soyslinkteam_tag%
    #     前提：服务器已安装 PlaceholderAPI 且 EssentialsX/CMI 启用了 PAPI 挂钩。
    #
    #  2) 头顶名称（数据包方案，需 ProtocolLib）：见下方 nametag 段。
    #     EssentialsX / CMI 仅作为 softdepend 用于共存检测，
    #     本插件通过数据包注入虚拟队伍前缀，不会接管它们的计分板/昵称。
    # ============================================================

    # --------------------------------------------------------------
    #  头顶名称 / 计分板（数据包方案，依赖 ProtocolLib）
    # --------------------------------------------------------------
    nametag:
      # 是否启用头顶名称（简称作为玩家名前缀）
      enabled: true
      # 是否按角色着色玩家名（队长金 / 副队长蓝 / 队员默认）
      # 注意：Spigot 1.12.2 前缀上限 16 字符，角色颜色码会占用额度，超长时自动截断
      use-role-color: true
      # 玩家间碰撞规则（1.9+ 数据包字段，1.12.2 支持）
      #   always          - 始终可碰撞
      #   pushOtherTeams  - 仅与其他队伍碰撞
      #   pushOwnTeam     - 仅与自己队伍碰撞
      #   never           - 完全无碰撞
      collision-rule: NEVER
      # 玩家名可见性（1.9+ 数据包字段，1.12.2 支持）
      #   always              - 始终可见
      #   hideForOtherTeams   - 对其他队伍隐藏
      #   hideForOwnTeam      - 对自己队伍隐藏
      #   never               - 完全隐藏
      visibility: ALWAYS

  # --------------------------------------------------------------
  #  队伍公告
  # --------------------------------------------------------------
  notice:
    enabled: true
    max-length: 64
    # 成员上线时是否推送队伍公告
    show-on-join: true

  # --------------------------------------------------------------
  #  行为控制
  # --------------------------------------------------------------
  behavior:
    # 创建队伍冷却（秒），0 = 无冷却
    create-cooldown: 60
    # 退出队伍后再次加入任意队伍的冷却（秒），0 = 无冷却
    rejoin-cooldown: 30
    # 解散队伍是否需要二次确认
    disband-confirm: true
    # 二次确认有效期（秒）
    confirm-timeout: 15
    # 队长退出队伍时的处理方式
    #   TRANSFER = 自动转让给资历最老的成员（无成员则解散）
    #   DISBAND  = 直接解散队伍
    #   DENY     = 禁止队长退出，必须先转让或解散
    leader-quit-action: TRANSFER
    # 队长离线超过该分钟数后自动转让队长，0 = 关闭
    auto-transfer-offline: 0
    # 队伍变为空队伍时是否自动解散
    disband-when-empty: true
    # 是否允许队长踢出与自己同级(ADMIN)的成员
    leader-can-kick-admin: true

    # --------------------------------------------------------------
    #  队伍频道聊天（/steam chat）
    # --------------------------------------------------------------
    team-chat:
      # 是否开启队伍频道聊天
      enabled: true
      # 频道内消息格式，可用占位: {player} {message}
      format: '&8[&e队伍&8] &f{player}&8: &7{message}'
      # 管理员旁听权限节点: soyslinkteam.chat.spy


# ============================================================================
#  入队方式
# ----------------------------------------------------------------------------
#  入队方式已抽象化，每种方式是一个独立的 JoinMethod 实现。
#  第三方插件可通过 API 注册自定义入队方式，并在此处补充配置节点。
#  order 决定 /team join 未指定方式时的尝试顺序（数字越小越优先）。
# ============================================================================
join:

  # 玩家同时最多可加入的队伍数量
  # 注意：当前版本（v1.0）数据模型固定为 1 队，配置值 >1 时会在启动时给出警告并被限制为 1，
  #       多队支持将在未来版本实现。此处保留配置项以便平滑升级。
  max-teams-per-player: 1

  methods:

    # ---------- 队长邀请 ----------
    invite:
      enabled: true
      order: 10
      # 邀请有效期（秒）
      expire: 60
      # 单个玩家同时可持有的待处理邀请上限
      max-pending: 5
      # 同一队伍对同一玩家的重复邀请冷却（秒）
      resend-cooldown: 15
      # 是否允许邀请离线玩家（离线玩家上线后收到提示）
      allow-offline: false

    # ---------- 公开队伍直接加入 ----------
    public:
      enabled: true
      order: 20
      # 新创建的队伍默认是否公开
      default-public: false
      # 公开队伍是否仍需队长在线
      require-leader-online: false

    # ---------- 口令加入 ----------
    password:
      enabled: true
      order: 30
      min-length: 3
      max-length: 16
      # 口令输入错误上限，超过后进入冷却
      max-attempts: 5
      # 达到错误上限后的冷却时间（秒）
      attempt-cooldown: 60
      # 口令是否区分大小写
      case-sensitive: true

    # ---------- 经济消耗加入（依赖 Vault + 经济插件） ----------
    economy:
      enabled: false
      order: 40
      # 单队入队费用上限，0 = 不限制
      max-cost: 1000
      # 说明：队长通过 /steam set cost <金额> 设置本队入队费用，
      #       玩家加入时自动扣除。设置为 0 或 off 可清除费用。
      #       管理员（soyslinkteam.admin.bypass）可免费用。


# ============================================================================
#  权限体系
# ----------------------------------------------------------------------------
#  权限判定采用责任链模式，按 providers 顺序依次询问每个 Provider：
#    ALLOW = 立即放行    DENY = 立即拒绝    PASS = 交给下一个 Provider
#  全部 PASS 时使用 default-result 兜底。
#
#  内置 Provider:
#    admin - 基于 Bukkit 权限节点，持有 soyslinkteam.admin.manage 的玩家
#            可以对任意队伍执行任意操作
#    role  - 基于队内角色(LEADER / ADMIN / MEMBER)，映射见下方 roles
#
#  第三方插件可通过 API 注册新的 Provider（如 VIP 体系、赛季体系），
#  并把它的 id 加入 providers 列表中的任意位置。
# ============================================================================
permission:

  # 判定链顺序
  providers:
    - admin
    - role

  # 全链 PASS 时的兜底结果: ALLOW / DENY
  default-result: DENY

  # --------------------------------------------------------------
  #  队内角色 -> 可执行动作
  #  '*' 表示全部动作
  #  可用动作:
  #    INVITE        邀请玩家
  #    KICK          踢出成员
  #    DISBAND       解散队伍
  #    TRANSFER      转让队长
  #    PROMOTE       提升成员为副队长
  #    DEMOTE        降级副队长
  #    RENAME        修改队伍名称
  #    SET_TAG       修改队伍简称
  #    SET_NOTICE    修改队伍公告
  #    SET_PUBLIC    切换公开状态
  #    SET_PASSWORD  设置/清除口令
  #    SET_COST      设置入队费用
  #    VIEW_INFO     查看队伍详情
  #    LEAVE         退出队伍
  # --------------------------------------------------------------
  roles:
    LEADER:
      - '*'
    ADMIN:
      - INVITE
      - KICK
      - SET_NOTICE
      - SET_PUBLIC
      - SET_PASSWORD
      - SET_COST
      - VIEW_INFO
      - LEAVE
    MEMBER:
      - VIEW_INFO
      - LEAVE

  # 副队长(ADMIN 角色)人数上限，0 = 不允许设置副队长
  max-team-admins: 2

  # --------------------------------------------------------------
  #  VIP 权限体系（依赖 LuckPerms，读取玩家 vip-tier 元数据）
  #  设置玩家 VIP 等级: lp user <玩家> meta set vip-tier <等级>
  #  启用后需在上方 providers 列表中加入 vip
  # --------------------------------------------------------------
  vip:
    enabled: false
    tiers:
      # 示例：svip 等级允许邀请、设置公告、切换公开状态
      svip:
        allow:
          - INVITE
          - SET_NOTICE
          - SET_PUBLIC
      # 示例：vvip 等级允许全部管理动作
      vvip:
        allow:
          - '*'
