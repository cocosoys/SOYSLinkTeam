# ============================================================
#  SOYSLinkTeam English language pack (en_us)
# ------------------------------------------------------------
#  Naming convention (aligned with SOYSHTTPOverMC i18n):
#   - Flat keys: one dotted key per line, fixed prefix soyslinkteam.
#   - Color codes use § directly (§), & is also accepted.
#   - Business placeholders are positional {0} {1} ... in left-to-right order;
#     a repeated placeholder in one message counts as a single slot.
#   - {prefix} is a built-in prefix placeholder: include it on prompted
#     messages; omit it on panels / titles / multi-line help.
#   - Multi-line messages use \n inside the double-quoted string.
# ============================================================

soyslinkteam.prefix: "§8[§bTeam§8] §r"

