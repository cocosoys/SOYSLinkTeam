# ============================================================
#  SOYSLinkTeam 中文语言包 (zh_cn)
# ------------------------------------------------------------
#  命名规范（与 SOYSHTTPOverMC i18n 对齐）：
#   - 平铺键：一行一条完整点分 key，固定前缀 soyslinkteam.
#   - 颜色码直接写 §（段落符号），同时兼容 &。
#   - 业务占位符为位置参数 {0} {1} ...，按文案从左到右出现顺序；
#     同一占位符在一条消息中重复出现只占一个位置。
#   - {prefix} 为内置前缀占位符：需要前缀的提示消息写它，
#     面板/标题/多行说明（info/list/admin.storage/help 等）不写。
#   - 多行消息在双引号字符串内用 \n 表示换行。
# ============================================================

